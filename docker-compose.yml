# QzBlog 一键部署（飞牛 NAS / 群晖 / 通用 Linux 均可）
#
# 首次部署：
#   1. cp .env.docker.example .env 并按注释填写（4 个必填项）
#   2. docker compose up -d --build
#   3. 浏览器访问 http://<NAS 地址>:<WEB_PORT>
#
# 详细说明、飞牛 NAS 注意事项与常见故障见 docs/DOCKER.md

services:
  # ---------------- 数据库 ----------------
  db:
    # 拉不到官方镜像时可用加速前缀覆盖，例如 MYSQL_IMAGE=docker.m.daocloud.io/library/mysql:8.0
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: qzblog-db
    restart: unless-stopped
    command:
      # 迁移文件里没有写字符集，库表字符集取自服务端默认值，必须显式指定 utf8mb4
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 应用按 UTC 读写 datetime(3)，服务端时区固定 UTC，避免隐式时区换算
      - --default-time-zone=+00:00
      # ---- 内存占用调优（NAS 内存紧张时默认值偏大，实测 mysqld 常驻 400MB+）----
      # performance_schema 默认开启，约占 150-250MB，个人博客用不到任何相关视图
      - --performance-schema=OFF
      # 默认 151 条连接，每条连接都有线程栈与缓冲区开销；应用连接池是 10，30 足够
      - --max-connections=30
      # 显式写死缓冲池，避免随宿主内存比例放大；库只有几十 MB，128M 绰绰有余
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qzblog}
      MYSQL_USER: ${MYSQL_USER:-qzblog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # MySQL 官方镜像的入口脚本以 root 启动并自行修正数据目录属主，绑定挂载可放心使用。
      # 不要放在 SMB/NFS 网络共享或 exFAT/NTFS 外置盘上：InnoDB 依赖文件锁与 POSIX 权限。
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
    # 数据库不映射到宿主端口（PRD 5.5）：只有 app 容器能连。确需用客户端连库时，
    # 取消下面两行注释，并确认只在内网开放。
    # ports:
    #   - "${DB_PORT:-3306}:3306"
    healthcheck:
      # mysqladmin ping 在认证失败但服务已就绪时同样返回 0，因此无需在探针里带密码
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 15
      # NAS 上首次初始化（建 InnoDB 系统表）可能要一两分钟，start_period 内不算失败
      start_period: 60s

  # ---------------- 应用 ----------------
  app:
    build:
      context: .
      args:
        # 以下三项只在构建期生效（写入响应头与图片白名单），改动后需 --build 重新构建
        ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
        EXTRA_IMAGE_HOSTS: ${EXTRA_IMAGE_HOSTS:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # 基础镜像名，可整体换成镜像加速前缀（见 docs/DOCKER.md 故障排查）
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    # 应用镜像在本地构建：up 时若出现 "app Pulling ... registry-1.docker.io ... connection reset"
    # 属正常现象（compose 会先尝试拉同名镜像，失败后照常构建），可以忽略。
    image: qzblog:latest
    container_name: qzblog-app
    restart: unless-stopped
    depends_on:
      db:
        # 用 service_started 而不是 service_healthy：健康检查偏严（比如 NAS 首次初始化较慢）
        # 会让整个栈直接启动失败，而应用自身会等待数据库并就绪后自动继续（见 docker/bootstrap.mjs），
        # 任一环节真的有问题时，db 仍然是 unhealthy、应用日志里会打印具体错误码，便于定位。
        condition: service_started
    ports:
      # 只暴露这一个端口；改 WEB_PORT 可避开飞牛自身服务或其他容器占用的端口。
      # 启用下面的 https profile（或前面挂了反向代理）后，建议设 WEB_BIND=127.0.0.1，
      # 让应用只由代理访问：这样 TRUSTED_PROXY_IP_HEADER 才不会被直连请求伪造。
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:3000"
    environment:
      # 数据库只认上面 db 服务那组 MYSQL_* 变量，密码只写一处：
      # 应用原生支持这组分项变量（见 src/lib/database-url.ts），会自行拼装连接串，
      # 密码里的 @ : / ? # 等字符无需手写转义。
      # 想改用连接串的话，在这里补一行 DATABASE_URL（应用优先使用它，注意自行 URL 编码）。
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qzblog}
      MYSQL_USER: ${MYSQL_USER:-qzblog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      # 必须是你实际访问博客的地址，否则登录后会被跳回错误域名
      SITE_URL: ${SITE_URL:?请在 .env 中设置 SITE_URL（例如 http://192.168.5.2:8080）}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?请在 .env 中设置 NEXTAUTH_URL（例如 http://192.168.5.2:8080）}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?请在 .env 中设置 NEXTAUTH_SECRET（至少 32 位随机字符）}
      ANONYMOUS_ID_SECRET: ${ANONYMOUS_ID_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      AUTH_TRUST_PROXY: ${AUTH_TRUST_PROXY:-false}
      # 反向代理会覆写 X-Real-IP / X-Forwarded-For 时才填写，直连留空
      TRUSTED_PROXY_IP_HEADER: ${TRUSTED_PROXY_IP_HEADER:-}
      # 单实例部署用进程内限流；多副本/需要跨实例共享计数时改用 Upstash（见 docs/DOCKER.md）
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      ENABLE_GITHUB_AUTH: ${ENABLE_GITHUB_AUTH:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # 附件默认存本地磁盘（uploads 卷，同源 /api/files/* 提供）；启用 minio profile 后改 s3
      ATTACHMENTS_STORAGE: ${ATTACHMENTS_STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qzblog}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # 限制 Node 堆上限：默认在 8GB 机器上会放到 4GB，内存紧张时容易把整机拖进 swap。
      # 博客场景 384MB 足够；真遇到大响应导致 OOM 再调大即可。
      NODE_OPTIONS: "--max-old-space-size=384"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 附件与备份用命名卷：首次使用时 Docker 会把镜像内目录（属主 nextjs）复制进卷，
      # 因此不需要手工 chown，容器重启/升级都不丢数据。
      # 若想把附件放在自己的共享目录，改成绑定挂载，并把运行用户对齐目录属主：
      #   - ${DATA_DIR:-./data}/uploads:/app/uploads
      #   - ${DATA_DIR:-./data}/backups:/app/backups
      #   user: "${PUID:-1000}:${PGID:-1000}"   # 之后需 chown -R ${PUID}:${PGID} 该目录
      - qzblog_uploads:/app/uploads
      - qzblog_backups:/app/backups
    # 与 Dockerfile 里的 HEALTHCHECK 等价；放在 compose 里是为了不改镜像就能调宽限期
    # （慢速 NAS 首次启动 + 首次迁移建表可能超过 3 分钟，窗口太短会误报 unhealthy）
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/console/login').then(r=>{process.exitCode=r.status<500?0:1}).catch(()=>{process.exitCode=1})"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  # ---------------- 可选：HTTPS 入口（profile: https） ----------------
  # 应用自身不做 TLS，而 443 已被飞牛自己的 nginx 占用（访问会 302 跳到管理界面），
  # 所以用 Caddy 在 8443 上提供 HTTPS 并反代到 app:3000。启用步骤见 docs/DOCKER.md 第 5 节：
  #   1. .env 里把 SITE_URL / NEXTAUTH_URL 改成 https 地址（否则登录会跳回 http）
  #      并设 TRUSTED_PROXY_IP_HEADER=x-forwarded-for（Caddy 会覆写该头）
  #   2. docker compose --profile https up -d
  # 默认用 Caddy 内部 CA 自签证书（浏览器首次会提示不受信任，可导入其根证书或换成自己的证书）。
  https:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: qzblog-https
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Caddy 要据此签发证书，必须与浏览器里访问用的地址一致（IP 或域名）。
      # 用 IP 走内部 CA 自签；换成公网域名时需去掉 Caddyfile 里的 local_certs 并配置 ACME 或自有证书。
      HTTPS_HOST: ${HTTPS_HOST:-192.168.5.2}
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      # 挂载整个 docker/caddy 目录而不是单个文件：单文件绑定挂载在 git 拉取（写新文件后改名）
      # 时会指向旧 inode，容器里读到的仍是旧内容，只有重建容器才生效；挂目录则始终看到最新内容，
      # 也便于把自有证书放进 docker/caddy/ 下一起挂进来
      - ./docker/caddy:/etc/caddy:ro
      # 证书与内部 CA 持久化：卷被删除后浏览器需要重新信任一次
      - qzblog_caddy_data:/data
      - qzblog_caddy_config:/config

  # ---------------- 可选：MinIO 对象存储 ----------------
  # 默认不启动。需要时：
  #   1. .env 填 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD，并把 ATTACHMENTS_STORAGE 改为 s3，
  #      同时设置 S3_ENDPOINT=http://minio:9000、S3_PUBLIC_URL=http://<NAS 地址>:9000/qzblog
  #   2. docker compose --profile minio up -d --build
  #   3. 首次启动后创建存储桶并设为公开只读（命令见 docs/DOCKER.md）
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: qzblog-minio
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # 不用 :? 强制必填：compose 会在启用 profile 之前就校验整个文件的变量，
      # 默认部署（不带 --profile minio）不该被这几个变量拦住。
      # 启用该 profile 时必须先在 .env 里填好，否则 MinIO 会拒绝启动。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - qzblog_minio:/data

volumes:
  qzblog_uploads:
  qzblog_backups:
  qzblog_minio:
  qzblog_caddy_data:
  qzblog_caddy_config:
